<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ملك ❤️ مؤمن</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Tahoma, sans-serif;
  background: radial-gradient(circle at top, #3b0015, #0a0004);
  color:#fff;
  text-align:center;
  overflow:hidden;
}

/* قلوب الخلفية */
.heart-bg{
  position:fixed;
  top:-10%;
  font-size:20px;
  color:rgba(255,45,85,0.7);
  animation: fall linear infinite;
}

@keyframes fall{
  0%{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  100%{
    transform:translateY(120vh) scale(1.5);
    opacity:0;
  }
}

.container{
  position:relative;
  z-index:10;
  max-width:500px;
  margin:40px auto;
  padding:20px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 40px rgba(255,0,80,0.3);
}

.date{opacity:.7;}

.message{
  line-height:1.9;
  margin:20px 0;
}

input{
  width:80%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:16px;
}

button{
  margin-top:15px;
  width:85%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#ff2d55;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="container">
  <div class="date">2025/2/8</div>
  <h1>ملك ❤️ مؤمن</h1>

  <div class="message">
    من أول مرة دخلتي حياتي، وكل حاجة بقت ليها طعم تاني.<br>
    الضحكة بقت من قلبي، والوقت بقى يعدي أسرع.<br>
    المكان ده معمول مخصوص ليكي ❤️
  </div>

  <p>اكتبي الباسورد يا دلوعتي 👇</p>
  <input type="password" id="pass" placeholder="Password">
  <br>
  <button onclick="unlock()">✨ Unlock</button>

  <div id="secret" class="hidden">
    <h2>أنا مؤمن…</h2>
    <p>
      واخد القرار من يوم ما حبيتك،<br>
      وهفضل مختارك كل يوم ❤️
    </p>
  </div>
</div>

<audio id="song" src="song.mp3"></audio>

<script>
/* توليد القلوب */
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart-bg";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.animationDuration = (4 + Math.random()*6) + "s";
  heart.style.fontSize = (14 + Math.random()*20) + "px";
  document.body.appendChild(heart);

  setTimeout(()=>{heart.remove();},10000);
}
setInterval(createHeart,400);

/* Unlock */
function unlock(){
  const input = document.getElementById("pass").value;
  const correct = "2025/2/8";

  if(input === correct){
    document.getElementById("secret").classList.remove("hidden");
    document.getElementById("song").play();
  }else{
    alert("غلط يا قمر 😅");
  }
}
</script>

</body>
</html>
