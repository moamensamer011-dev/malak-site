<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ملك ❤️ مؤمن</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: 'Tahoma', sans-serif;
  background: radial-gradient(circle at top, #3b0015, #0a0004);
  color:#fff;
  text-align:center;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:20px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 40px rgba(255,0,80,0.3);
}

.date{
  opacity:.7;
  margin-bottom:10px;
}

h1{
  margin-top:10px;
}

.message{
  line-height:1.9;
  margin:20px 0;
}

input{
  width:80%;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  text-align:center;
  font-size:16px;
}

button{
  margin-top:15px;
  width:85%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#ff2d55;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none;
}

.heart{
  color:#ff2d55;
  font-size:24px;
}
</style>
</head>

<body>

<div class="container">
  <div class="date">2025/2/8</div>
  <h1>ملك ❤️ مؤمن</h1>

  <div class="message">
    من أول مرة دخلتي حياتي، وكل حاجة بقت ليها طعم تاني.<br>
    الضحكة بقت من قلبي، والوقت بقى يعدي أسرع.<br>
    المكان ده معمول مخصوص ليكي…<br><br>
    <span class="heart">❤️</span>
  </div>

  <p>اكتبي الباسورد يا دلوعتي 👇</p>

  <input type="password" id="pass" placeholder="Password">
  <br>
  <button onclick="unlock()">✨ Unlock</button>

  <div id="secret" class="hidden">
    <h2>أنا مؤمن…</h2>
    <p>
      واخد القرار من يوم ما حبيتك،<br>
      وفضلت من بين الدنيا بعين تانية.<br>
      بحبك ❤️
    </p>
  </div>
</div>

<audio id="song" src="song.mp3"></audio>

<script>
function unlock(){
  const input = document.getElementById("pass").value;
  const correct = "2025/2/8"; // الباسورد الحقيقي (مش باين في الصفحة)

  if(input === correct){
    document.getElementById("secret").classList.remove("hidden");
    document.getElementById("song").play();
  } else {
    alert("غلط يا قمر 😅");
  }
}
</script>

</body>
</html>
